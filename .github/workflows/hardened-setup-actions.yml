# Demo: Chainguard hardened setup-* actions on the bare upstream runner.
#
# k3s-dev-default runs the stock ghcr.io/actions/actions-runner image with no
# toolchains, so this is where setup actions actually earn their keep — and
# where their supply-chain risk normally lives. Here every setup action is the
# Chainguard hardened mirror (github.com/chainguard-actions), SHA-pinned.
#
# The job ends with the hardening-summary composite action, which parses this
# workflow's own pins and renders Chainguard's published HARDENING.md /
# source.json for each action into the run summary — the audit trail comes
# from the catalog itself, not hand-written claims.
#
# Contrast with toolchain-versions.yml: on the Custom Assembly runners none of
# these setup steps exist because the toolchains are baked into the runner image.
name: Hardened setup actions (bare default runner)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/hardened-setup-actions.yml"
      - ".github/actions/hardening-summary/**"

permissions: {}

jobs:
  setup-actions:
    name: setup-java / setup-python / setup-go (k3s-dev-default)
    runs-on: k3s-dev-default # upstream ghcr.io/actions/actions-runner — bare, no toolchains
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout (Chainguard hardened)
        # uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (upstream)
        uses: chainguard-actions/actions-checkout@1f8e63dffdffd00f53e08b42f3ec278c5dfed4a2 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove the runner is bare
        run: |
          # Expected to find nothing — the default image ships no toolchains.
          for tool in java python3 go; do
            command -v "${tool}" >/dev/null && echo "${tool}: $(command -v "${tool}")" \
              || echo "${tool}: not present (as expected on the bare runner)"
          done

      - name: Setup Java (Chainguard hardened)
        # uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1 (upstream)
        uses: chainguard-actions/actions-setup-java@9f7867fb15bac2c9fb673542f7f98d7448fd0a2b # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Python (Chainguard hardened)
        # uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (upstream)
        uses: chainguard-actions/actions-setup-python@7a645df7de98e1f15c6cfe20f52eb2f254e62cc9 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup Go (Chainguard hardened)
        # uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (upstream)
        uses: chainguard-actions/actions-setup-go@cfd6917d3c2c59d1f1e5bdf35a2f69269adff2e8 # v7.0.0
        with:
          go-version: stable

      - name: Show installed toolchain versions
        run: |
          set -euo pipefail
          java -version 2>&1
          python3 --version
          go version

      - name: Toolchain summary
        run: |
          set -euo pipefail
          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          | Toolchain | Version | Provenance |
          |---|---|---|
          | Java | \`$(java -version 2>&1 | head -1)\` | chainguard-actions/actions-setup-java |
          | Python | \`$(python3 --version 2>&1)\` | chainguard-actions/actions-setup-python |
          | Go | \`$(go version)\` | chainguard-actions/actions-setup-go |
          EOF

      - name: Hardening summary
        uses: ./.github/actions/hardening-summary
        with:
          runner-notes: >-
            **Runner:** `k3s-dev-default` — stock `ghcr.io/actions/actions-runner`, no toolchains.
            Toolchains were installed at job time by Chainguard hardened setup actions.
            On the Custom Assembly runners (see *Toolchain versions* workflow) all three
            setup steps disappear — the toolchains ship inside the hardened runner image.
