# Demo: toolchain versions on the Chainguard actions-runner Custom Assembly
# images. The toolchains are baked into the runner image (Python/JDK/Go on
# actions-runner-pyjdkgo, Python on actions-runner-py3, kubectl & friends on
# actions-runner-k8s-tools), so no setup-* action — and no toolchain download
# from a third party at job time — is needed at all.
#
# Every `uses:` here is a Chainguard hardened action (github.com/chainguard-actions),
# SHA-pinned. Each job logs the hardening applied per action and appends a
# summary table to the workflow run page.
#
# Swap the -dev labels for -prod to run the same jobs in the prod cluster.
name: Toolchain versions (Custom Assembly runners)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/toolchain-versions.yml"

permissions: {}

jobs:
  pyjdkgo:
    name: Python + JDK + Go (k3s-dev)
    runs-on: k3s-dev # actions-runner-pyjdkgo — Custom Assembly: Python, Java, Go baked in
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (Chainguard hardened)
        uses: chainguard-actions/actions-checkout@1f8e63dffdffd00f53e08b42f3ec278c5dfed4a2 # v7.0.1
        with:
          persist-credentials: false

      - name: Hardening applied to this job's actions
        run: |
          echo "::group::chainguard-actions/actions-checkout@v7.0.1"
          echo "Drop-in hardened mirror of actions/checkout, pinned to commit 1f8e63d."
          echo "- immutable SHA pin: upstream tag moves cannot inject code into this job"
          echo "- blocks fork checkout under pull_request_target/workflow_run unless"
          echo "  allow-unsafe-pr-checkout is set (pwn-request guard)"
          echo "- persist-credentials disabled: no token left in .git/config"
          echo "::endgroup::"

      - name: Show toolchain versions (baked into the runner image)
        run: |
          set -euo pipefail
          echo "::group::Python"
          python3 --version
          echo "::endgroup::"
          echo "::group::Java"
          java -version 2>&1
          javac -version
          echo "::endgroup::"
          echo "::group::Go"
          go version
          echo "::endgroup::"

      - name: Hardening summary
        run: |
          set -euo pipefail
          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          ## Hardening summary — ${GITHUB_JOB}

          **Runner:** \`k3s-dev\` — Chainguard \`actions-runner-pyjdkgo\` (Custom Assembly).
          Python, JDK, and Go ship inside the hardened runner image: zero toolchain
          downloads at job time, zero setup-* actions in the supply chain.

          | Toolchain | Version | Provenance |
          |---|---|---|
          | Python | \`$(python3 --version 2>&1)\` | baked into runner image (cgr.dev) |
          | Java | \`$(java -version 2>&1 | head -1)\` | baked into runner image (cgr.dev) |
          | Go | \`$(go version)\` | baked into runner image (cgr.dev) |

          | Action used | Pin | Hardening |
          |---|---|---|
          | \`chainguard-actions/actions-checkout\` | \`1f8e63d\` (v7.0.1) | Chainguard hardened mirror, SHA-pinned, pwn-request guard, credentials not persisted |

          Workflow-level: \`permissions: {}\` top level, job requests \`contents: read\` only.
          EOF

  python-only:
    name: Python (python-dev)
    runs-on: python-dev # actions-runner-py3 — Custom Assembly: Python only
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (Chainguard hardened)
        uses: chainguard-actions/actions-checkout@1f8e63dffdffd00f53e08b42f3ec278c5dfed4a2 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain versions (baked into the runner image)
        run: |
          set -euo pipefail
          python3 --version
          pip --version 2>/dev/null || python3 -m pip --version || true

      - name: Hardening summary
        run: |
          set -euo pipefail
          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          ## Hardening summary — ${GITHUB_JOB}

          **Runner:** \`python-dev\` — Chainguard \`actions-runner-py3\` (Custom Assembly).
          Single-toolchain image: the smallest possible CI surface for Python jobs.

          | Toolchain | Version | Provenance |
          |---|---|---|
          | Python | \`$(python3 --version 2>&1)\` | baked into runner image (cgr.dev) |

          | Action used | Pin | Hardening |
          |---|---|---|
          | \`chainguard-actions/actions-checkout\` | \`1f8e63d\` (v7.0.1) | Chainguard hardened mirror, SHA-pinned, pwn-request guard, credentials not persisted |

          Workflow-level: \`permissions: {}\` top level, job requests \`contents: read\` only.
          EOF

  k8s-tools:
    name: Deployment tooling (deployments-dev)
    runs-on: deployments-dev # actions-runner-k8s-tools — Custom Assembly: deployment tooling
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (Chainguard hardened)
        uses: chainguard-actions/actions-checkout@1f8e63dffdffd00f53e08b42f3ec278c5dfed4a2 # v7.0.1
        with:
          persist-credentials: false

      - name: Show deployment tooling (baked into the runner image)
        run: |
          set -euo pipefail
          kubectl version --client
          # Optional extras in the k8s-tools assembly; print whichever are present.
          for tool in helm kustomize crane cosign; do
            if command -v "${tool}" >/dev/null; then
              echo "::group::${tool}"
              "${tool}" version 2>&1 || "${tool}" --version
              echo "::endgroup::"
            fi
          done

      - name: Hardening summary
        run: |
          set -euo pipefail
          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          ## Hardening summary — ${GITHUB_JOB}

          **Runner:** \`deployments-dev\` — Chainguard \`actions-runner-k8s-tools\` (Custom Assembly).
          Deploy tooling ships in the runner image — the same posture deploy-env.yml
          relies on: no curl-to-bash installs, no unpinned marketplace setup actions.

          | Toolchain | Version | Provenance |
          |---|---|---|
          | kubectl | \`$(kubectl version --client -o json | grep gitVersion | head -1 | tr -d ' ",' | cut -d: -f2)\` | baked into runner image (cgr.dev) |

          | Action used | Pin | Hardening |
          |---|---|---|
          | \`chainguard-actions/actions-checkout\` | \`1f8e63d\` (v7.0.1) | Chainguard hardened mirror, SHA-pinned, pwn-request guard, credentials not persisted |

          Workflow-level: \`permissions: {}\` top level, job requests \`contents: read\` only.
          EOF
