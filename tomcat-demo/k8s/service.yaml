# Fronts tomcat-demo-0. The pre-provisioned traefik Ingress routes
# host {{ tomcat_demo_ingress_host }} -> service tomcat-demo:8080.
apiVersion: v1
kind: Service
metadata:
  name: tomcat-demo
  namespace: public
  labels:
    app: tomcat-demo
spec:
  selector:
    app: tomcat-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
